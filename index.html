<!-- 🔵 دائرة التحكم بالطائرة (لللمس) -->
<!-- =============================== -->
<div class="control-circle-container" id="controlCircleContainer">
    <div class="control-circle-outer">
        <div class="direction-dot up"></div>
        <div class="direction-dot down"></div>
        <div class="direction-dot left"></div>
        <div class="direction-dot right"></div>
        <div class="control-circle-inner" id="controlCircle"></div>
    </div>
</div>


    <script>
        (function () {

          /* منع الزوم بالكيبورد */
          document.addEventListener('keydown', function (e) {
            if (e.ctrlKey || e.metaKey) {
              const key = e.key.toLowerCase();
              if (key === '+' || key === '-' || key === '=' || key === '0') {
                e.preventDefault();
              }
            }
          });
      
          /* منع Ctrl + عجلة الماوس */
          document.addEventListener('wheel', function (e) {
            if (e.ctrlKey || e.metaKey) {
              e.preventDefault();
            }
          }, { passive: false });
      
          /* منع الزوم باللمس (Pinch) */
          document.addEventListener('touchstart', function (e) {
            if (e.touches.length > 1) {
              e.preventDefault();
            }
          }, { passive: false });
      
          /* منع Double Tap */
          let lastTouch = 0;
          document.addEventListener('touchend', function (e) {
            const now = Date.now();
            if (now - lastTouch < 300) {
              e.preventDefault();
            }
            lastTouch = now;
          }, false);
      
          /* إجبار الزوم = 100% */
          document.body.style.zoom = "100%";
          document.documentElement.style.zoom = "100%";
      
        })();

        document.addEventListener("contextmenu", function(e) {

            if (e.target.tagName === "IMG" || e.target.tagName === "A") {
                e.preventDefault();
            }
        
        });
    </script>
